name: CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements/pilot-constraints.txt -e '.[test]'
      - run: python -m pytest -q
      - name: Qwen resource and provisioning CPU checks
        run: >-
          python -m pytest -q
          analysis/qwen_execution_provisioning_runtime_v1/tests
          analysis/qwen_execution_runtime_alt_v1/tests
          analysis/qwen_execution_resource_alt_v1/tests
          tests/test_runpod_stopped_preflight.py
      - run: rsna-knee doctor
